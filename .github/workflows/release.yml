name: Build & Release

# Runs when you publish a new version tag (e.g. v1.5.1) — from GitHub "Releases → Draft a new release" or `git tag v1.5.1 && git push --tags`
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER=$(node -p "require('./package.json').version"); fi
          echo "VER=$VER" >> $GITHUB_ENV
          npm version "$VER" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Package app
        shell: bash
        run: |
          npx @electron/packager . "MC Pack Studio" --platform=win32 --arch=x64 --out=dist --overwrite --asar \
            --icon=build/icon.ico --app-version="$VER" \
            --ignore='^/test' --ignore='^/dist' --ignore='^/release' --ignore='^/\.github' --ignore='\.nsi$' --ignore='\.bmp$'

      - name: Install NSIS (if missing)
        shell: pwsh
        run: |
          $m = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $m)) {
            # Chocolatey is sometimes down (503), so use the NSIS build that electron-builder hosts on GitHub
            $url = "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z"
            Invoke-WebRequest $url -OutFile nsis.7z -MaximumRetryCount 5 -RetryIntervalSec 5
            7z x nsis.7z -o"$env:RUNNER_TEMP\nsis" -y | Out-Null
            $m = (Get-ChildItem "$env:RUNNER_TEMP\nsis" -Recurse -Filter makensis.exe | Where-Object { $_.FullName -notmatch "\\Bin\\" } | Select-Object -First 1).FullName
          }
          "MAKENSIS=$m" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "makensis: $m"

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & $env:MAKENSIS /V2 "/DVER=$env:VER" build\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: MC Pack Studio ${{ env.VER }}
          files: release/*.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
