name: Build & Release

# Manual only: Actions → "Build & Release" → Run workflow → choose the version tag.
# (Releases are published by hand; this just builds an installer if you want one.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.5.2)'
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Version from tag
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"; VER="${VER#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VER=$(node -p "require('./package.json').version"); fi
          echo "VER=$VER" >> $GITHUB_ENV
          npm version "$VER" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: Package app
        shell: bash
        run: |
          npx @electron/packager . "MC Pack Studio" --platform=win32 --arch=x64 --out=dist --overwrite --asar \
            --icon=build/icon.ico --app-version="$VER" \
            --ignore='^/test' --ignore='^/dist' --ignore='^/release' --ignore='^/\.github' --ignore='\.nsi$' --ignore='\.bmp$'

      - name: Install NSIS (if missing)
        shell: pwsh
        run: if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 "/DVER=$env:VER" build\installer.nsi

      - name: Upload installer (download it from this run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MC-Pack-Studio-Setup-${{ env.VER }}
          path: release/*.exe
